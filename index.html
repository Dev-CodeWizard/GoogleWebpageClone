<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Homepage </title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <nav class="top-nav">
            <div class="left-links">
                <img src="assets/googlelogo.jpg" class="googlelogo">    
                <a href="https://about.google/?fg=1&utm_source=google-IN&utm_medium=referral&utm_campaign=hp-header">About</a>
                <a href="https://store.google.com/in/?utm_source=hp_header&utm_medium=google_ooo&utm_campaign=GS100042&hl=en-IN">Store</a>
            </div>

            <div class="right-links">
                <a href="https://workspace.google.com/intl/en-US/gmail/">Gmail</a>
                <a href="https://images.google.com/">Images</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="search-area" >
   
        <img src="assets/google.png" class="logo">

            <p class="notice">Project for GDGSC Mentorship Programe</p>

            <form class="search-form" role="search">
                <label class="visually-hidden" for="search">Search the web</label>

                <span class="search-icon" aria-hidden="true">⌕</span>

                <input type="search" id="search" name="q" placeholder="Ask Google or type a URL" >
            </form>

            <div class="buttons">
                 <a href="https://www.google.com" class="button-link">Google Search</a>

                 <a href="https://doodles.google/" class="button-link">I'm Feeling lucky</a>
            </div>

        </section>
    </main>

    <footer>
        <div class="footer-left">
            <a href="https://business.google.com/in/google-ads/">Advertising</a>
            <a href="https://business.google.com/in/business-profile/">Business</a>
        </div>

        <div class="footer-right">
            <a href="https://policies.google.com/privacy?hl=en-IN&fg=1">Privacy</a>
            <a href="https://policies.google.com/terms?hl=en-IN&fg=1">Terms</a>
            <a href="https://www.google.com/preferences?hl=en-IN&fg=1/">Settings</a>
        </div>
    </footer>

</body>
</html>
